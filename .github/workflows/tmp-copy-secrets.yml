name: tmp-copy-secrets
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      S_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      S_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      S_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      S_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Copy secrets to peak-ios-port
        run: |
          for n in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD PRIVATE_REPO_TOKEN; do
            v="S_$n"
            if [ -z "${!v}" ]; then echo "$n: empty"; continue; fi
            printf '%s' "${!v}" | gh secret set "$n" -R m7830380-cyber/peak-ios-port >/dev/null && echo "$n: set" || echo "$n: FAILED"
          done
          gh api repos/m7830380-cyber/peak-ios-private --jq '"private repo visible to token: " + .full_name'
